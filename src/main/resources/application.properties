#configuracao de LOG
quarkus.log.level = INFO
quarkus.log.category."br.unitins.topicos1".level = TRACE

#configuracao do console log
quarkus.log.console.color = true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t)  %s%e%n
quarkus.log.console.level = DEBUG

#configuracao do log em arquivos
quarkus.log.file.enable=true
quarkus.log.file.path=/tmp/log_tp1_2024.log
quarkus.log.file.level=DEBUG
quarkus.log.file.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t)  %s%e%n
quarkus.log.file.rotation.file-suffix=.dd-MM-yyyy-HH-mm

quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, origin
quarkus.http.cors.exposed-headers=*, Authorization, location
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true
#──────────────────────────────────────────────
# Desativa o DevServices do Quarkus
quarkus.devservices.enabled=false

#──────────────────────────────────────────────
# OpenAPI: use só HTTP Bearer-JWT
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme.bearer-jwt.type=http
quarkus.smallrye-openapi.security-scheme.bearer-jwt.scheme=bearer
quarkus.smallrye-openapi.security-scheme.bearer-jwt.bearer-format=JWT

#──────────────────────────────────────────────
# Keycloak OIDC (API stateless via Bearer-JWT)
quarkus.oidc.auth-server-url=http://localhost:8180/realms/MeuRealm
quarkus.oidc.client-id=EnvioEmailApp
quarkus.oidc.credentials.secret=kAsno8mrpjPStZ2e5wcu9wMwkeXo7ykH
quarkus.oidc.application-type=service

# extrai papéis do access token (obs.: sem underscore!)
quarkus.oidc.roles.source=accesstoken
# aceita tokens cujo “aud” contenha “account”
quarkus.oidc.token.audience=account

#──────────────────────────────────────────────
# Permissões HTTP
# rotas públicas (login + Swagger UI + OpenAPI JSON)
quarkus.http.auth.permission.public.paths=/api/auth/*,/q/*,/openapi
quarkus.http.auth.permission.public.policy=permit

# rotas protegidas (tudo em /api/*)
quarkus.http.auth.permission.secure.paths=/api/*
quarkus.http.auth.permission.secure.policy=authenticated

#──────────────────────────────────────────────
