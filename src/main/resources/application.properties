quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = mail
quarkus.datasource.password = 123456
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/maildb

%prod.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql = false

mp.jwt.verify.publickey.location = token/chave_publica.pem
mp.jwt.verify.issuer=mail-jwt
smallrye.jwt.sign.key.location=token/chave_privada.pem

# Configuração SMTP
quarkus.mailer.from=kethelenvictoria2016@gmail.com
quarkus.mailer.host=smtp.gmail.com
quarkus.mailer.port=587
quarkus.mailer.username=kethelenvictoria2016@gmail.com
quarkus.mailer.password="Sua chave de acesso" o gmail fornece uma chave de acesso 
quarkus.mailer.ssl=false   
quarkus.mailer.start-tls=OPTIONAL
quarkus.mailer.mock=false

#configuracao de LOG
quarkus.log.level = INFO
quarkus.log.category."br.unitins.topicos1".level = TRACE

#configuracao do console log
quarkus.log.console.color = true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t)  %s%e%n
quarkus.log.console.level = DEBUG

#configuracao do log em arquivos
quarkus.log.file.enable=true
quarkus.log.file.path=/tmp/log_tp1_2024.log
quarkus.log.file.level=DEBUG
quarkus.log.file.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t)  %s%e%n
quarkus.log.file.rotation.file-suffix=.dd-MM-yyyy-HH-mm

quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers= *, Authorization
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true